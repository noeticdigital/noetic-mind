<head>

<!--
  ════════════════════════════════════════════════════════════════════════
  NOETIC · SYSTEM MAP  —  internal, living architecture graph
  ────────────────────────────────────────────────────────────────────────
  An interactive graph of the whole system: the client demo (4 silos, loops,
  modules, functions), the JTBD interview copilot, the internal methodology
  toolbox, files/assets, external connections, the real noeticapp SaaS
  codebase + infra, the vault/gbrain, the Gstack skill framework, and the
  business/vision layer. Drag nodes, zoom, filter layers, click for detail,
  search. Graph engine: vis-network (CDN). Hand-authored from a repo scan.
  ════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.bunny.net" />
<link href="https://fonts.bunny.net/css?family=fraunces:400,500,600|inter:400,500,600,700|jetbrains-mono:400,500" rel="stylesheet" />
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root{
  --paper:#0d1118; --surface:#161b24; --surface-2:#10141b; --ink:#e7eaf0; --ink-2:#aeb4c1; --muted:#7c8493;
  --line:#262d39; --line-strong:#39414f; --accent:#5e95d8; --accent-ink:#8fb6e6;
  --font-serif:'Fraunces',Georgia,serif; --font-sans:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:var(--font-mono)}

/* top bar */
.bar{height:54px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#11151c,#0d1118);position:relative;z-index:6}
.bar .brand{display:flex;align-items:center;gap:10px}
.bar .brand img{width:26px;height:26px;display:block}
.bar .ttl{font-family:var(--font-serif);font-size:18px;font-weight:500;letter-spacing:-.01em}
.bar .sub{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:1px}
.bar .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2)}
.search input{background:none;border:none;outline:none;color:var(--ink);font-size:13px;width:200px}
.search input::placeholder{color:var(--muted)}
.tbtn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);font-size:12.5px;font-weight:500;transition:.13s}
.tbtn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* layout */
.wrap{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex}
#graph{flex:1;min-width:0;background:
  radial-gradient(1100px 700px at 60% 20%, rgba(94,149,216,.06), transparent 60%), var(--paper)}

/* legend / filters */
.legend{width:248px;flex:none;border-right:1px solid var(--line);background:var(--surface-2);overflow-y:auto;padding:14px 12px}
.legend h3{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 4px 8px}
.lrow{display:flex;align-items:center;gap:9px;width:100%;padding:6px 7px;border-radius:7px;font-size:12px;color:var(--ink-2);
  text-align:left;transition:.12s}
.lrow:hover{background:rgba(94,149,216,.08)}
.lrow .sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.15)}
.lrow .cnt{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.lrow.off{opacity:.4}
.lrow.off .lbl{text-decoration:line-through}
.legend .lall{display:flex;gap:6px;margin:4px 4px 12px}
.legend .lall button{flex:1;font-size:11px;padding:5px;border-radius:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2)}
.legend .lall button:hover{border-color:var(--accent);color:var(--accent-ink)}
.legend .note{font-size:10.5px;color:var(--muted);line-height:1.5;padding:10px 6px 4px;border-top:1px solid var(--line);margin-top:10px}

/* detail panel */
.detail{position:absolute;top:70px;right:16px;width:300px;max-height:calc(100% - 90px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.55);
  padding:16px 17px;z-index:5;opacity:0;pointer-events:none;transform:translateY(-6px);transition:.16s}
.detail.on{opacity:1;pointer-events:auto;transform:none}
.detail .dk{display:inline-flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--muted)}
.detail .dk .sw{width:9px;height:9px;border-radius:3px}
.detail h2{font-family:var(--font-serif);font-size:19px;font-weight:500;margin:9px 0 4px;line-height:1.2}
.detail p{font-size:13px;line-height:1.55;color:var(--ink-2)}
.detail .dconn{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.detail .dconn .dl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px}
.detail .dconn a{display:block;font-size:12px;color:var(--accent-ink);padding:3px 0;cursor:pointer}
.detail .dconn a:hover{text-decoration:underline}
.detail .dclose{position:absolute;top:11px;right:12px;color:var(--muted);font-size:16px;line-height:1}

.loading{position:absolute;inset:54px 0 0 248px;display:grid;place-items:center;color:var(--muted);font-size:14px;z-index:1}
.loading.gone{display:none}
.vis-network:focus{outline:none}
</style>
</head>

  E('saas','saas-val'),E('saas','infra'),E('saas-app','saas-admin'),E('saas-app','saas-api'),E('saas-app','saas-components'),
  E('saas-db','infra-pg'),E('saas-ai','ext-llm',1),E('saas','ext-github',1),
  // infra
  E('infra','infra-pg'),E('infra','infra-redis'),E('infra','infra-docker'),E('infra','infra-ec2'),E('infra','infra-drizzle'),
  E('infra-ec2','vault',1),
  // vault
  E('vault','gbrain'),E('gbrain','saas',1),E('gbrain','vault'),
  // gstack
  E('gstack','gs-routing'),E('gstack','gs-brain'),E('gstack','gs-overlays'),
  E('gstack','gs-plan'),E('gstack','gs-ship'),E('gstack','gs-quality'),E('gstack','gs-design'),
  E('gstack','gs-docs'),E('gstack','gs-browser'),E('gstack','gs-safety'),E('gstack','gs-gbrainskill'),E('gstack','gs-ios'),E('gstack','gs-misc'),
  E('gstack','noetic',1),E('gstack','ext-llm',1),E('gs-gbrainskill','gbrain',1),E('gs-brain','gbrain',1),
  E('gs-ship','ext-github',1),
  // vision
  E('vision','noetic'),E('vision','v-interviewers'),E('vision','v-research'),E('vision','v-firecrawl'),
  E('vision','v-playbook'),E('vision','v-security'),E('vision','v-cos'),
  E('v-interviewers','loop-progress',1),E('v-research','vault',1),E('v-firecrawl','ext-context',1),
  E('v-security','saas',1),E('v-cos','saas',1),
];

/* ───────────────────────── render ───────────────────────── */
let NET, nodesDS, edgesDS, hidden=new Set();
const $=id=>document.getElementById(id);

function boot(){
  if(!window.vis){ $('loading').textContent='Could not load the graph engine (vis-network CDN). Check the connection and reload.'; return; }
  const visGroups={}; Object.keys(GROUPS).forEach(g=>{ visGroups[g]={color:{background:GROUPS[g].c,border:'#ffffff22',highlight:{background:GROUPS[g].c,border:GROUPS[g].c}},
    font:{color:'#dfe4ec'}}; });
  nodesDS=new vis.DataSet(NODES.map(n=>({id:n.id,label:n.label,group:n.group,size:n.size,title:n.title})));
  edgesDS=new vis.DataSet(EDGES.map((e,i)=>({id:'e'+i,from:e.from,to:e.to,dashes:e.dashes})));
  NET=new vis.Network($('graph'),{nodes:nodesDS,edges:edgesDS},{
    nodes:{shape:'dot',borderWidth:2,font:{face:'Inter',size:13,strokeWidth:0,color:'#dfe4ec'},
      scaling:{label:{enabled:true,min:11,max:20}}},
    edges:{color:{color:'#313a48',highlight:'#5e95d8',hover:'#5e95d8',opacity:0.85},width:1,selectionWidth:2,
      smooth:{type:'continuous',roundness:0.4},arrows:{to:{enabled:true,scaleFactor:0.42}}},
    groups:visGroups,
    physics:{solver:'barnesHut',barnesHut:{gravitationalConstant:-9500,centralGravity:0.25,springLength:120,springConstant:0.035,damping:0.45,avoidOverlap:0.15},
      stabilization:{iterations:300},minVelocity:0.6},
    interaction:{hover:true,tooltipDelay:140,navigationButtons:true,keyboard:false,multiselect:false},
  });
  NET.once('stabilizationIterationsDone',()=>{ $('loading').classList.add('gone'); });
  setTimeout(()=>$('loading').classList.add('gone'),3500);
  NET.on('click',p=>{ if(p.nodes.length) showDetail(p.nodes[0]); else closeDetail(); });
  buildLegend();
}

function buildLegend(){
  const host=$('legendRows'); const counts={};
  NODES.forEach(n=>counts[n.group]=(counts[n.group]||0)+1);
  host.innerHTML=Object.keys(GROUPS).map(g=>
    `<button class="lrow" data-g="${g}" onclick="toggleGroup('${g}')">
       <span class="sw" style="background:${GROUPS[g].c}"></span><span class="lbl">${GROUPS[g].l}</span>
       <span class="cnt">${counts[g]||0}</span>
     </button>`).join('');
}
function toggleGroup(g){
  if(hidden.has(g)) hidden.delete(g); else hidden.add(g);
  document.querySelector(`.lrow[data-g="${g}"]`).classList.toggle('off',hidden.has(g));
  applyFilter();
}
function setAll(on){
  hidden = on ? new Set() : new Set(Object.keys(GROUPS));
  document.querySelectorAll('.lrow').forEach(r=>r.classList.toggle('off',!on));
  applyFilter();
}
function applyFilter(){
  nodesDS.update(NODES.map(n=>({id:n.id,hidden:hidden.has(n.group)})));
}

/* detail panel */
function showDetail(id){
  const n=NODES.find(x=>x.id===id); if(!n) return;
  const g=GROUPS[n.group];
  $('dKind').querySelector('.sw').style.background=g.c;
  $('dKindLbl').textContent=g.l;
  $('dTitle').textContent=n.label;
  $('dDesc').textContent=n.title||'';
  const conn=[...new Set(EDGES.filter(e=>e.from===id||e.to===id).map(e=>e.from===id?e.to:e.from))]
    .map(cid=>{const c=NODES.find(x=>x.id===cid);return c?`<a onclick="showDetail('${cid}');NET.focus('${cid}',{scale:1.1,animation:true})">${c.label}</a>`:''}).join('');
  $('dConn').innerHTML = conn ? `<div class="dl">Connected (${EDGES.filter(e=>e.from===id||e.to===id).length})</div>${conn}` : '';
  $('detail').classList.add('on');
  NET.selectNodes([id]);
}
function closeDetail(){ $('detail').classList.remove('on'); }

/* search */
$('q').addEventListener('keydown',e=>{ if(e.key!=='Enter') return;
  const q=e.target.value.trim().toLowerCase(); if(!q) return;
  const hit=NODES.find(n=>n.label.toLowerCase().includes(q)) || NODES.find(n=>(n.title||'').toLowerCase().includes(q));
  if(hit){ NET.selectNodes([hit.id]); NET.focus(hit.id,{scale:1.2,animation:true}); showDetail(hit.id); }
});

/* physics toggle */
let phys=true;
function togglePhysics(){ phys=!phys; NET.setOptions({physics:{enabled:phys}}); $('physBtn').textContent='Physics: '+(phys?'on':'off'); }

boot();
</script>
