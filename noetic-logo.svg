  <g opacity="0.18">
    <rect x="291" y="788" width="84" height="10" rx="5" fill="#CAD2DC"/>
    <rect x="420" y="552" width="70" height="9" rx="4.5" fill="#CAD2DC"/>
    <rect x="545" y="690" width="70" height="9" rx="4.5" fill="#CAD2DC"/>
    <rect x="666" y="805" width="83" height="10" rx="5" fill="#CAD2DC"/>
